name: tests

# 这份 CI 只跑"不需要图形界面"的内核测试。
# ui_smoke.py / _audit_thumbs.py 需要真实 Qt 窗口 + 字体，
# 无头 runner 上截图会变成方框、字体缺失导致误判，
# 那几个测试留在开发机上跑（见 README「测试」一节）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: 内核测试 (Python ${{ matrix.python-version }})
    # 不能用 ubuntu-latest：它已经滚到 26.04，actions/setup-python 在
    # 那上面**装不出 3.9 及更老的 Python**（"not found for Ubuntu 26.04"）。
    # 而本项目的目标运行环境恰恰是 UOS 20 自带的 Python 3.7，
    # 老版本的兼容性正是最该盯的东西，所以在能拿到旧版 Python 的
    # 22.04 上跑。等 22.04 退役再考虑换 runner 或换装法。
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 3.9 贴近目标环境（UOS 20 是 3.7，但 3.7 已无官方 runner 支持）；
        # 3.12 用来提前发现新版本上的语法/API 依赖
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymupdf

      - name: 语法检查（目标环境是 Python 3.7）
        run: |
          python - <<'PY'
          import ast, os, sys
          files = [os.path.join(dp, f)
                   for dp, _dn, fn in os.walk("pdfstudio") for f in fn if f.endswith(".py")]
          files.append("run.py")
          bad = []
          for path in files:
              src = open(path, encoding="utf-8").read()
              try:
                  ast.parse(src, path, feature_version=(3, 7))
              except SyntaxError as exc:
                  bad.append("%s: %s" % (path, exc))
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("OK: %d 个文件都符合 Python 3.7 语法" % len(files))
          PY

      - name: 内核测试
        run: python tests/smoke_core.py
